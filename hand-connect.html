<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Connect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100%; height: 100%; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #dim {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.82) 100%);
    pointer-events: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="dim"></div>
<canvas id="fg"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

<script>
const video = document.getElementById('video');
const fg = document.getElementById('fg');
const ctx = fg.getContext('2d');

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  fg.width = W * DPR; fg.height = H * DPR;
  fg.style.width = W + 'px'; fg.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Fingertip landmark indices in MediaPipe
const TIPS = {
  thumb:  4,
  index:  8,
  middle: 12,
  ring:   16,
  pinky:  20
};

// Colour per string. User asked for pink, yellow, green, white — five fingers,
// so I'm adding cyan to fill thumb. Each entry is {h,s,l} for neon hues.
const STRINGS = [
  { name: 'thumb',  tip: TIPS.thumb,  hue: 190, sat: 100, light: 70, white: false }, // cyan
  { name: 'index',  tip: TIPS.index,  hue: 325, sat: 100, light: 68, white: false }, // hot pink
  { name: 'middle', tip: TIPS.middle, hue: 55,  sat: 100, light: 65, white: false }, // yellow
  { name: 'ring',   tip: TIPS.ring,   hue: 130, sat: 100, light: 60, white: false }, // green
  { name: 'pinky',  tip: TIPS.pinky,  hue: 0,   sat: 0,   light: 100, white: true } // white
];

let latestHands = null;
let t0 = performance.now();

function onResults(results) {
  const lms = results.multiHandLandmarks || [];
  const handed = results.multiHandedness || [];
  const packed = lms.map((lm, i) => ({
    lm,
    label: handed[i] ? handed[i].label : (i === 0 ? 'Left' : 'Right')
  }));
  // Sort so index 0 is always the "Left" hand (real-world left / viewer's left after mirror)
  packed.sort((a, b) => a.label.localeCompare(b.label));
  latestHands = packed;
}

// Sparks: short-lived glowing particles
const sparks = [];
function spawnSpark(x, y, hue, light, speed = 1) {
  const a = Math.random() * Math.PI * 2;
  const v = (0.4 + Math.random() * 1.6) * speed;
  sparks.push({
    x, y,
    vx: Math.cos(a) * v,
    vy: Math.sin(a) * v - 0.2,
    life: 0,
    maxLife: 0.35 + Math.random() * 0.55,
    hue, light,
    size: 1 + Math.random() * 2.2
  });
}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life += dt;
    if (s.life >= s.maxLife) { sparks.splice(i, 1); continue; }
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.94;
    s.vy = s.vy * 0.94 + 0.06; // gentle gravity
  }
}

function drawSparks() {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    const k = 1 - s.life / s.maxLife;
    const r = s.size * (0.6 + k * 1.8);
    const alpha = k * k;

    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 5);
    g.addColorStop(0, `hsla(${s.hue}, 100%, ${Math.min(100, s.light + 20)}%, ${0.9 * alpha})`);
    g.addColorStop(0.4, `hsla(${s.hue}, 100%, ${s.light}%, ${0.45 * alpha})`);
    g.addColorStop(1, `hsla(${s.hue}, 100%, ${s.light}%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsla(${s.hue}, 30%, 100%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Line-segment intersection; returns point or null
function segIntersect(p1, p2, p3, p4) {
  const x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
  const x3 = p3.x, y3 = p3.y, x4 = p4.x, y4 = p4.y;
  const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(den) < 1e-6) return null;
  const tN = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
  const uN = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;
  if (tN < 0 || tN > 1 || uN < 0 || uN > 1) return null;
  return { x: x1 + tN * (x2 - x1), y: y1 + tN * (y2 - y1) };
}

function drawString(a, b, s, tSec) {
  // Sag: mid-point droops slightly and wobbles — feels stringy
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const sag = Math.min(60, len * 0.06);
  const wobble = Math.sin(tSec * 2 + s.hue * 0.05) * 4;
  const cx = mx + wobble;
  const cy = my + sag + wobble * 0.3;

  const pulse = 0.78 + 0.22 * Math.sin(tSec * 3.2 + s.hue * 0.04);

  const hue = s.hue, sat = s.sat, light = s.light;

  // Outer halo
  ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${light}%, ${0.12 * pulse})`;
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(cx, cy, b.x, b.y);
  ctx.stroke();

  // Mid glow
  ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${Math.min(100, light + 5)}%, ${0.32 * pulse})`;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(cx, cy, b.x, b.y);
  ctx.stroke();

  // Core laser
  ctx.strokeStyle = `hsla(${hue}, ${sat}%, ${Math.min(100, light + 15)}%, ${0.85 * pulse})`;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(cx, cy, b.x, b.y);
  ctx.stroke();

  // White-hot inner
  ctx.strokeStyle = `hsla(0, 0%, 100%, ${0.85 * pulse})`;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(cx, cy, b.x, b.y);
  ctx.stroke();
}

let lastT = performance.now();

function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const tSec = (now - t0) / 1000;

  ctx.clearRect(0, 0, W, H);

  // Mirror foreground to match mirrored video
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  if (latestHands && latestHands.length === 2) {
    const [h0, h1] = latestHands;
    const segs = STRINGS.map(s => {
      const a = { x: h0.lm[s.tip].x * W, y: h0.lm[s.tip].y * H };
      const b = { x: h1.lm[s.tip].x * W, y: h1.lm[s.tip].y * H };
      return { s, a, b };
    });

    ctx.globalCompositeOperation = 'lighter';
    for (const seg of segs) drawString(seg.a, seg.b, seg.s, tSec);
    ctx.globalCompositeOperation = 'source-over';

    // Continuous fingertip sparkles
    for (const seg of segs) {
      if (Math.random() < 0.55) spawnSpark(seg.a.x, seg.a.y, seg.s.hue, seg.s.light, 0.8);
      if (Math.random() < 0.55) spawnSpark(seg.b.x, seg.b.y, seg.s.hue, seg.s.light, 0.8);
    }

    // Intersections — burst sparks
    for (let i = 0; i < segs.length; i++) {
      for (let j = i + 1; j < segs.length; j++) {
        const p = segIntersect(segs[i].a, segs[i].b, segs[j].a, segs[j].b);
        if (!p) continue;
        const hueMix = (segs[i].s.hue + segs[j].s.hue) / 2;

        // Steady bright core at the crossing
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 28);
        g.addColorStop(0, `hsla(0, 0%, 100%, 0.95)`);
        g.addColorStop(0.3, `hsla(${hueMix}, 100%, 75%, 0.7)`);
        g.addColorStop(1, `hsla(${hueMix}, 100%, 60%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        // Spawn burst sparks
        const n = 2 + (Math.random() < 0.4 ? 2 : 0);
        for (let k = 0; k < n; k++) spawnSpark(p.x, p.y, hueMix, 75, 1.6);
      }
    }
  } else if (latestHands && latestHands.length === 1) {
    // Small idle sparkle at fingertips so there's still presence
    const h = latestHands[0];
    for (const s of STRINGS) {
      const tip = h.lm[s.tip];
      const x = tip.x * W, y = tip.y * H;
      if (Math.random() < 0.2) spawnSpark(x, y, s.hue, s.light, 0.5);
    }
  }

  updateSparks(dt);
  drawSparks();

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

const camera = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 1280,
  height: 720
});
camera.start();
</script>
</body>
</html>
